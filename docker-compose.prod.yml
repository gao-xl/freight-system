# 货运代理管理系统 - 服务器适配部署编排（复用 1Panel 外部 PostgreSQL）
#
# 与仓库根 docker-compose.yml 的差异：
#   1. 移除 pg 服务：数据库复用 1Panel 已安装的 PostgreSQL（宿主机 IP:5432）
#   2. backend 直连宿主机的 postgres，通过 DB_HOST 指定
#   3. 资源限制按低内存服务器（1G RAM + 2G swap）调低
#   4. gitea 占用 3000 端口，backend 对外映射改为 3001，frontend 用 8080
#
# 镜像来源：CI 在 GitHub 云端构建并推送 ghcr.io，服务器只 pull 不本地构建。
# 使用方式：
#   cp .env.prod .env && vim .env   (填 JWT_SECRET 等，并设 IMAGE_REGISTRY / IMAGE_TAG)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 如需本地构建（开发调试），去掉 image 前的 IMAGE_REGISTRY 变量并改回 build 即可。

name: freight-system-prod

services:
  backend:
    image: ${IMAGE_REGISTRY:-}freight-system-backend:${IMAGE_TAG:-latest}
    container_name: freight-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_DIALECT: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    image: ${IMAGE_REGISTRY:-}freight-system-frontend:${IMAGE_TAG:-latest}
    container_name: freight-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M