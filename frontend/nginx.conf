# 2 核 / 1G 低内存优化：
#   worker_processes=1：内部低频系统单个 worker 足够，省内存省上下文切换
worker_processes 1;
pid /var/run/nginx.pid;

events {
    # 内部系统并发不高，1024 连接足够；不要贪大（每个连接占内存）
    worker_connections 1024;
}

http {
    # 本文件整体替换 /etc/nginx/nginx.conf（见 frontend/Dockerfile），
    # 需显式引入 MIME 类型表，否则静态资源 Content-Type 会错
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 静态文件零拷贝发送，省 CPU 省内存
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    # 隐藏版本号，减少信息泄露
    server_tokens off;
    # 打开文件缓存：命中静态资源时不再走磁盘，省 I/O 省内存
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    # 上传/请求体缓冲控制在合理范围，避免大 buffer 占用内存
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # 后端上游：keepalive 复用连接，减少握手开销
    upstream backend_upstream {
        server backend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 单证附件上传走这条链路，默认 1m 太小，与后端 express 的 10mb 对齐留出余量
        client_max_body_size 20m;

        # nginx 自身存活探针，不经过后端
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 接口反代到后端容器。proxy_pass 不带路径，原始 URI 原样透传给后端。
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "";
            # 报表导出、批量单证解析属于慢接口，超时放宽到 120s
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
            proxy_buffers 4 32k;
            proxy_buffer_size 8k;
        }

        # Swagger 接口文档与 OpenAPI 描述文件
        location /api-docs {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /openapi.json {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 开发文档（与 /api-docs 一致，由后端统一输出，不占独立端口）
        location /docs/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 带内容哈希的构建产物，可以长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 使用教程：静态 HTML 直接命中；目录/裸路径回退到 SPA 入口，
        # 避免引导用户输入 /guide 或刷新时被 nginx 当目录处理返回 403。
        # 注意不能用 $uri/（会因 autoindex 关闭且无 index.html 而 403）。
        location ^~ /guide {
            try_files $uri /index.html;
        }

        # 入口 HTML 不缓存，否则发版后用户会一直拿到旧的 assets 引用
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Service Worker 与 Manifest 不缓存：保证发版后能第一时间拉到新版本
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
        }

        # Vue Router history 模式回退：非静态资源一律交给前端路由
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
