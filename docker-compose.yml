# 货运代理管理系统 - 一键部署编排
#
# 首次启动（三步）:
#   1. cp .env.example .env        并在 .env 里填一个高强度 JWT_SECRET
#   2. docker compose run --rm backend npm run seed    建表 + 演示数据（仅首次，会清库）
#   3. docker compose up -d
#   浏览器访问 http://localhost:8080  （开发文档并入后端，访问 http://localhost:8080/docs，无独立端口）
#
# 注意：后端镜像会封入开发文档。构建后端镜像前需先在本机生成文档产物：
#   cd docs-site && npm install && npm run build   （产物落到 backend/public/docs）
# 否则后端镜像缺 /docs，需在 docs-site 构建后重新 docker compose build backend。
#
# 日常运维:
#   docker compose logs -f backend            看日志
#   docker compose exec backend npm run backup   立即备份
#   docker compose down                       停服（数据在 pg 数据卷里，不会丢）
#
# 数据库：系统仅支持 PostgreSQL，pg 为必启基础服务，backend 依赖其健康后启动。
#
# 多架构 / 多平台（x86 / ARM / Linux / Windows）:
#   - 本文件不写死 platform：本地 docker compose up 会自动按当前宿主机架构
#     拉取/构建对应镜像（Docker Desktop 在 Windows 上走 WSL2 跑 Linux 容器）。
#   - 需要同时产出 amd64 + arm64 镜像并分发时，用仓库根目录的跨架构构建：
#       ./build.sh --push           (Linux/macOS)
#       .\build.ps1 -Push           (Windows)
#     其底层是 docker buildx bake（docker-bake.hcl），构建出的多架构镜像
#     push 到仓库后，任意 x86/ARM 主机 docker compose 都能自动选中正确架构。
#   - 极端情况想在单平台强制指定架构，可取消下方对应服务的 platform 注释。

name: freight-system

services:
  # PostgreSQL 基础服务（必启）
  # postgres:16-alpine 官方清单覆盖 amd64/arm64/arm/v7 等，无需指定架构
  pg:
    image: postgres:16-alpine
    container_name: freight-pg
    restart: unless-stopped
    # 强制运行架构示例（取消注释并按需改）：
    # platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-freight}
      POSTGRES_USER: ${DB_USER:-freight}
      # 安全加固：不再提供弱默认密码。DB_PASSWORD 未设置/为空时 docker compose 直接报错拒绝启动，
      # 强制在 .env 中配置高强度数据库密码（fail-closed，避免弱口令数据库裸奔）。
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请先在 .env 中设置高强度 DB_PASSWORD 后再启动}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 只绑本机回环，不暴露到公网；需要外部工具连库时再改
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    # 针对 2 核 / 1G 内存的 PostgreSQL 调优：
    #   shared_buffers=128MB（约 12% 内存）          索引扫描/排序/哈希用小 work_mem=4MB
    #   effective_cache_size=256MB                  维护操作（备份/索引/vacuum）给 32MB
    #   max_connections=30                          1G 内存下压低连接数（每个连接约 5~10MB）
    #   max_wal_size=512MB / min_wal_size=64MB      控制 WAL 峰值，避免小磁盘被撑满
    #   random_page_cost=1.1                        阿里云 SSD 云盘：顺序/随机读代价接近
    #   autovacuum 更激进                           防表膨胀导致的索引退化与磁盘增长
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINT_WORK_MEM:-32MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-30}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-512MB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-64MB}
      - -c
      - checkpoint_timeout=900s
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - autovacuum=on
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-freight} -d ${DB_NAME:-freight}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 资源上限：防止单容器内存/CPU 失控拖垮宿主机；上限=天花板，实际常驻低于此值。
    # 2 核 / 1G 默认给 320M；内存更大可在 .env 里用 PG_MEM_LIMIT 调高。
    deploy:
      resources:
        limits:
          cpus: "${PG_CPU_LIMIT:-1.0}"
          memory: "${PG_MEM_LIMIT:-320M}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    # 镜像名做成可配（对齐 CD 的 GHCR 推送标签）：
    #   本地构建/单机：docker compose build → freight-system-backend:latest（与 docker-bake.hcl 默认一致）
    #   服务器拉取：.env 设 IMAGE_REGISTRY=ghcr.io/<owner>/ IMAGE_TAG=main，
    #     docker compose pull 即可命中 CI 推送的 ghcr.io/<owner>/freight-system-backend:main
    image: ${IMAGE_REGISTRY:-}freight-system-backend:${IMAGE_TAG:-latest}
    container_name: freight-backend
    restart: unless-stopped
    # 强制运行架构示例（取消注释并按需改）：
    # platform: linux/arm64

    depends_on:
      # 等 PostgreSQL 健康检查通过再起，避免后端连不上库反复重试
      pg:
        condition: service_healthy

    # .env 里的变量整体注入，二开新增的适配器密钥等自定义项无需改本文件
    env_file: .env

    # 下面几项固定为容器内取值，覆盖 .env 中面向本地开发的配置。
    # 注意：本文件只能出现一个 environment 块（重复键会导致 docker compose 解析失败）。
    environment:
      # 生产模式：JWT_SECRET 缺失会拒绝启动，这是有意为之，不要为了跑通改成 development
      NODE_ENV: production
      # 容器内端口固定 3000，对外映射由下面的 ports 决定，改 .env 的 PORT 不影响
      PORT: "3000"
      # 容器内连本人自己的 pg 服务，服务名固定 pg
      DB_DIALECT: postgres
      DB_HOST: pg
      DB_PORT: "5432"
      TZ: ${TZ:-Asia/Shanghai}
      # 共享缓存：仅当启用 cache profile 的 redis 伴生服务时才注入地址；
      # 缺省留空 = 后端使用进程内内存缓存（零外部依赖，单实例开箱即用）。
      # 启用方式：.env 设置 REDIS_URL=redis://redis:6379 且 docker compose --profile cache up -d
      REDIS_URL: ${REDIS_URL:-}

    ports:
      # 后端直连端口。只用浏览器访问的话可以整行注释掉，让后端只在内网可达
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      # 上传文件与备份落在宿主机目录里，容器重建/升级镜像都不会丢
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      # 备份默认落 ./backend/backups（对接内置备份守护 BACKUP_DIR 默认值）。
      # NAS / 低成本设备场景：想让备份直接落到独立挂载盘，可取消下行注释并改成你的路径；
      # 同时到 .env 里设 BACKUP_DIR=<容器内挂载点>，例如 BACKUP_DIR=/mnt/nas/freight-backups。
      # - /mnt/nas/freight-backups:/mnt/nas/freight-backups
      - ./backend/backups:/app/backups

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # 资源上限：后端含 PDF 渲染(chromium)，打印单证是内存峰值操作。
    # 2 核 / 1G：Node 堆已用 NODE_OPTIONS 封顶，chromium 仅在打印时临时拉起，
    # 峰值靠宿主机 swap 兜底，故设 512M；内存更大可在 .env 用 BACKEND_MEM_LIMIT 调高。
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: "${BACKEND_MEM_LIMIT:-512M}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    image: ${IMAGE_REGISTRY:-}freight-system-frontend:${IMAGE_TAG:-latest}
    container_name: freight-frontend
    restart: unless-stopped
    # 强制运行架构示例（取消注释并按需改）：
    # platform: linux/arm64
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      # 等后端健康检查通过再起，避免 nginx 因解析不到 backend 上游而启动失败
      backend:
        condition: service_healthy
    # 资源上限：nginx 静态代理很轻，给低配即可；2G 内存以上可调大
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: "${FRONTEND_MEM_LIMIT:-128M}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# F7 共享缓存：可选伴生服务，默认不启动（profile=cache）。
  # 启用方式：.env 设置 REDIS_URL=redis://redis:6379 后，
  #   docker compose --profile cache up -d    （同时拉起 redis 和后端）
  # 未启用时后端自动降级进程内内存缓存（单实例零依赖）。
  redis:
    image: redis:7-alpine
    container_name: freight-redis
    restart: unless-stopped
    profiles: ["cache"]            # 默认不启动；docker compose --profile cache up -d 启用
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: "${REDIS_MEM_LIMIT:-128M}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg-data:
  redis-data:
