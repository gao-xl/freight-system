name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:        # 支持手动触发全量 CI（含安全回归）

jobs:
  backend:
    name: 后端测试 (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      # 冒烟测试连接 PostgreSQL 测试库
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 安装 Chromium 运行依赖（PDF 渲染测试需要）
        # ubuntu-latest 预装 google-chrome-stable，但 headless 启动缺少若干共享库，
        # 不装会导致 pdf.test.js D1-2 超时回退 pdfkit 返回 null 而失败。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpango-1.0-0 libcairo2 libx11-xcb1

      - name: 静态检查（ESLint 架构铁律）
        run: npm run lint

      - name: 冒烟测试（启动 → 登录 → 业务接口 → 自动化幂等）
        run: |
          # 先在空库上重建表结构并插入演示数据（seed 用 sequelize.sync({force:true}) 重建全部表）
          # 注：seed 直读 DB_* 配置，故此处同时设置 DB_* 与 TEST_DB_*（后者供 smoke.test.js 内部映射）
          npm run seed
          npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: freight_test
          DB_USER: freight
          DB_PASSWORD: freight
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_NAME: freight_test
          TEST_DB_USER: freight
          TEST_DB_PASSWORD: freight

  security-regression:
    # 安全整改回归防线：每次 push/PR 独立触发，快速、明确地校验越权/提权修复不回归。
    # 独立于上面的大而全 backend 作业，让安全失败信号清晰可见、便于快速定位。
    name: 安全回归测试（越权/提权防线）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 安全回归测试（H-01 越权 / L-02/L-03 低权限写 / M-04 管理员保护 / L-06 会话失效）
        run: node --test --test-concurrency=1 tests/securityRegression.test.js
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_NAME: freight_test
          TEST_DB_USER: freight
          TEST_DB_PASSWORD: freight

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 构建
        run: npm run build

      - name: 上传构建产物（供 bootstrap 作业复用，避免重复构建）
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  docs:
    name: 开发文档构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 构建（产物落到 backend/public/docs）
        run: npm run build

      - name: 校验文档产物已生成且导航链接有效
        run: >
          node -e "const fs=require('fs');const p='../backend/public/docs';if(!fs.existsSync(p)){throw new Error('文档构建产物缺失: '+p)};const files=fs.readdirSync(p);console.log('[DOCS] 产物目录:',p,'文件数:',files.length)"

  bootstrap:
    # 部署后可用性验证（bootstrap all：check → init-db → setup-admin → verify）
    # 在真实 PostgreSQL 上完整跑通「配置检测 → 数据库初始化 → 管理员创建 → 可用性验证」，
    # 确保任何环境部署后系统可用，且幂等（可反复执行、绝不清库）。
    # 复用 frontend 作业的构建产物（needs: frontend），避免重复构建前端。
    # 依赖两项 CI 修复：check 阶段「库不存在」不再阻断 all（init-db 自动建库）、
    #                 setup-admin 通过 ADMIN_INIT_PASSWORD 非交互创建管理员。
    name: 部署引导验证 (bootstrap all)
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 下载前端构建产物（供 check 校验 frontend/dist）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 安装后端依赖
        run: npm install

      - name: 生成 CI 专用 .env（生产模式，供 bootstrap 读取）
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=3000
          JWT_SECRET=1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=freight_test
          DB_USER=freight
          DB_PASSWORD=freight
          CORS_ORIGIN=http://localhost:8080
          ADMIN_INIT_PASSWORD=FreightAdmin2026
          EOF

      - name: 一键引导（bootstrap all）
        run: node scripts/bootstrap.js all

  docker-build:
    # 推送到 main 时构建并推送多架构镜像（amd64 + arm64）到 GHCR，
    # 任意 x86/ARM 主机 docker compose 都能自动拉取匹配架构。
    # 仅推送 main，PR 不触发，避免未合并代码干扰镜像标签。
    # 在 GitHub 托管 runner（ubuntu-latest）上云端构建，QEMU 交叉编译 arm64，
    # 避免低配生产机（2核1G）本地构建拖垮内存。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: 多架构镜像构建与推送 (amd64+arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 构建开发文档产物（后端镜像依赖 backend/public/docs）
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # QEMU 让 x86 的 CI 机器也能为 arm64 交叉构建
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送多架构镜像
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ github.ref_name }}
          PLATFORMS: linux/amd64,linux/arm64
          # 用 -f docker-bake.hcl 显式只加载 HCL 定义，避免 bake 默认再合并根目录
          # docker-compose.yml（其 backend 服务引用 env_file: .env，CI runner 无该文件会报错）。
          # 占位 DB_PASSWORD 仅为防御性保留，HCL 构建本身不读取 compose。
          DB_PASSWORD: ci-placeholder
        run: docker buildx bake -f docker-bake.hcl --push
