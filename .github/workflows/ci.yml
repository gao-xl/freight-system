name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:        # 支持手动触发全量 CI（含安全回归）

jobs:
  backend:
    name: 后端测试 (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      # 冒烟测试连接 PostgreSQL 测试库
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 静态检查（ESLint 架构铁律）
        run: npm run lint

      - name: 冒烟测试（启动 → 登录 → 业务接口 → 自动化幂等）
        run: npm test
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_NAME: freight_test
          TEST_DB_USER: freight
          TEST_DB_PASSWORD: freight

  security-regression:
    # 安全整改回归防线：每次 push/PR 独立触发，快速、明确地校验越权/提权修复不回归。
    # 独立于上面的大而全 backend 作业，让安全失败信号清晰可见、便于快速定位。
    name: 安全回归测试（越权/提权防线）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight -d freight_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 安全回归测试（H-01 越权 / L-02/L-03 低权限写 / M-04 管理员保护 / L-06 会话失效）
        run: node --test --test-concurrency=1 tests/securityRegression.test.js
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 5432
          TEST_DB_NAME: freight_test
          TEST_DB_USER: freight
          TEST_DB_PASSWORD: freight

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 构建
        run: npm run build

  docs:
    name: 开发文档构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: 安装依赖
        run: npm install

      - name: 构建（产物落到 backend/public/docs）
        run: npm run build

      - name: 校验文档产物已生成且导航链接有效
        run: >
          node -e "const fs=require('fs');const p='../backend/public/docs';if(!fs.existsSync(p)){throw new Error('文档构建产物缺失: '+p)};const files=fs.readdirSync(p);console.log('[DOCS] 产物目录:',p,'文件数:',files.length)"

  docker-build:
    # 推送到 main 时构建并推送多架构镜像（amd64 + arm64）到 GHCR，
    # 任意 x86/ARM 主机 docker compose 都能自动拉取匹配架构。
    # 仅推送 main，PR 不触发，避免未合并代码干扰镜像标签。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: 多架构镜像构建与推送 (amd64+arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 构建开发文档产物（后端镜像依赖 backend/public/docs）
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # QEMU 让 x86 的 CI 机器也能为 arm64 交叉构建
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送多架构镜像
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ github.ref_name }}
          PLATFORMS: linux/amd64,linux/arm64
        run: docker buildx bake --push
